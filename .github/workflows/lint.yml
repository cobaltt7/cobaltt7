name: Lint
on:
    push:
    pull_request:
    workflow_dispatch:
    schedule:
        - cron: 30 23 * * *

permissions: {}

concurrency:
    group: ${{github.workflow}}-${{github.event.pull_request.number||github.ref}}
    cancel-in-progress: true

jobs:
    analyze:
        name: Analyze
        runs-on: ubuntu-24.04
        permissions:
            security-events: write # Used by github/codeql-action

        steps:
            - name: Checkout
              uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
              with:
                  persist-credentials: false

            - name: Setup CodeQL
              uses: github/codeql-action/init@9e0d7b8d25671d64c341c19c0152d693099fb5ba # v4.35.5
              with:
                  languages: javascript
                  queries: security-and-quality

            - name: Analyze
              uses: github/codeql-action/analyze@9e0d7b8d25671d64c341c19c0152d693099fb5ba # v4.35.5

    update:
        name: Update
        runs-on: ubuntu-24.04
        if: ${{github.event_name!='pull_request'}}
        permissions:
            contents: write # Needed to push

        steps:
            - name: Checkout
              uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
              with:
                  token: ${{secrets.TOKEN||github.token}}
                  persist-credentials: true

            - name: Setup Node.JS
              uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
              with:
                  node-version-file: package.json

            - name: Install
              run: npm ci

            - name: Update
              run: node --run start

            - name: Commit
              uses: stefanzweifel/git-auto-commit-action@04702edda442b2e678b25b537cec683a1493fcb9 # v7.1.0
              with:
                  commit_message: Update contributions list

    format:
        name: Format
        runs-on: ubuntu-24.04
        needs: update
        permissions:
            contents: write # Needed to push
            actions: write # Allow formatting actions too

        steps:
            - name: Checkout
              uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
              with:
                  token: ${{secrets.TOKEN||github.token}}
                  persist-credentials: true
                  fetch-depth: 0

            - name: Reset to latest commit
              run: |
                  branch=$(git branch --show-current)
                  git fetch origin $branch
                  git reset --hard origin/$branch

            - name: Setup Node.JS
              uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
              with:
                  node-version-file: package.json

            - name: Install
              run: npm ci

            - name: Format
              run: node --run format

            - name: Assert clean
              if: startsWith(github.ref_name, 'dependabot/') == true
              run: if [[ `git status --porcelain` ]]; then exit 1; fi

            - name: Commit
              uses: stefanzweifel/git-auto-commit-action@04702edda442b2e678b25b537cec683a1493fcb9 # v7.1.0
              with:
                  commit_message: Format
